<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/styleProfile.css">
</head>

<body>

    <div class="container">

        
        <div class="profile-card">

            
            <div class="profile-image"></div>

            
            <h2>Zainab</h2>

            
            <p class="role">
                Admin
            </p>

            
            <div class="info">

                <p>
                    <span>Email:</span>
                    zainab@gmail.com
                </p>

                <p>
                    <span>Phone:</span>
                    +234 xxx xxx xxxx
                </p>

                <p>
                    <span>Role:</span>
                    Administrator
                </p>

                <p>
                    <span>Status:</span>
                    Active
                </p>

            </div>

        
            <div class="report-section">

                <div class="box">
                    <h3>12</h3>
                    <p>Reports</p>
                </div>

                <div class="box">
                    <h3>8</h3>
                    <p>Tasks</p>
                </div>

                <div class="box">
                    <h3>5</h3>
                    <p>Projects</p>
                </div>

            </div>

            
            <div class="activity">

                <h3>Recent Activity</h3>

                <ul>
                    <li>Uploaded a report</li>
                    <li>Updated profile</li>
                    <li>Completed task</li>
                </ul>

            </div>

            
            <div class="buttons">

                <button class="edit-btn">
                    Edit
                </button>

                <button class="logout-btn">
                    Logout
                </button>

            </div>

        </div>

    </div>

</body>
</html>
