<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/stylelog.css">
</head>
<body>
    <main class="Auth-container">
        <section class="form login-card">
            <div class="card-header">
                <div class="header-text">
                    <h1>Welcome back</h1>
                    <p class="login-subheading">Sign In to access your account.</p>
                </div>
                <img class="header-icon" src="../assets/download.png" alt="Login illustration">
            </div>
            <form action="dashboard.html">
                <div class="input-form">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="input-form">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="form-row form-row-between">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a class="forgot-link" href="#">Forgot password?</a>
                </div>
                <button type="submit" class="register-btn">Login</button>
            </form>
            <p class="signIn-redirect">Don't have an account? <a href="register.html">SignUp</a></p>
                <p class="dashboard-redirect"><a href="dashboard.html">Go to Dashboard</a></p>

        </section>
    </main>
</body>
</html>
