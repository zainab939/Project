<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
    <link rel="stylesheet" href="../css/stylereg.css">
</head>
<body>
    <main class="Auth-container">
        <section class="form Register-form">
            <div class="card-header">
                <h1>Create an Account</h1>
                <p class="login-subheading">Join now to manage your account and explore the dashboard.</p>
            </div>

            <div id="formmessage" class="form-message"></div>
            <form id="registration" action="#" method="post" novalidate>
                <div class="input-form">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>
                <div class="input-form">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="input-form">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Choose a password" required>
                </div>
                <div class="input-form">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat password" required>
                </div>

                <button type="submit" class="register-btn" id="submitBtn">Create Account</button>
                <p class="signIn-redirect">
                    Already have an account? <a href="login.html">Sign in</a>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
